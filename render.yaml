# Render Blueprint — free deploy for Kyler's E-Bikes.
#
# In Render: New + → Blueprint → connect this repo. Render reads this file and
# creates a FREE web service. All data (listings, photos, logins) lives in
# MongoDB Atlas, so no paid disk is required.
#
# Before/at first deploy, set these in the Render dashboard (Environment):
#   MONGODB_URI     your MongoDB Atlas connection string
#   ADMIN_USERNAME  the admin login you want
#   ADMIN_PASSWORD  the admin password you want
services:
  - type: web
    name: kylers-ebikes
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Safety net: never let the test-only mongodb-memory-server download its
      # binary during a build (it isn't used at runtime).
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
